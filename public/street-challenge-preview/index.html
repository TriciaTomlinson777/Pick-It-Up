<!doctype html>
<html lang="en"><head><base href="/street-challenge-preview/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street Challenge · Get ready</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#543521;color:#087d83;font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #e85870;outline-offset:4px}

.toolbar{position:absolute;top:12px;right:14px;display:flex;gap:8px}.round{width:46px;height:46px;border:2px solid #fff9;background:#fff3cf;border-radius:50%;font-size:24px;box-shadow:0 3px 0 #66412355}

form{width:100%;display:none;flex:1;flex-direction:column;justify-content:center;align-items:center;gap:15px}label{font-size:21px;font-weight:bold}input{width:100%;border:3px solid #0b9295;border-radius:16px;background:#fff9e8;padding:12px;text-align:center;font-size:24px;color:#07575b;min-width:0}

.room.equipping .mission{display:none}.room.equipping h1{font-size:clamp(28px,7vw,42px);margin-bottom:4px}.room.equipping .final{justify-content:flex-start;gap:4px}.room.equipping .hello{font-size:19px;margin:4px 0}.actor{position:relative;display:flex;justify-content:center;width:100%;margin:8px 0}.room.equipping .actor .sprite{height:clamp(130px,24svh,185px);width:140px;max-height:none}.gear-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:8px 0}.gear-button{position:relative;border:3px solid #f2be42;background:#fff7d9;border-radius:17px;min-width:0;padding:5px;box-shadow:0 4px 0 #c69b36}.gear-art{display:block;width:100%;aspect-ratio:1;background:url(gear.webp) no-repeat;background-size:300% 100%}.gear-button[aria-pressed=true]{border-color:#07969b;background:#ccefe6;box-shadow:0 4px 0 #07969b}.gear-check{position:absolute;right:2px;top:0;color:#087c79;font-size:22px;font-weight:bold}.gear-pointer{position:absolute;bottom:-20px;left:30%;font-size:26px;animation:tap 1.1s infinite;pointer-events:none}@keyframes tap{50%{transform:translateY(-8px)}}.attached{position:absolute;width:60px;height:60px;z-index:2;pointer-events:none;background:url(gear.webp) no-repeat;background-size:300% 100%;filter:drop-shadow(0 3px 2px #53472b44)}.attached[data-gear=gloves]{left:calc(50% + 12px);top:34%;width:48px;height:48px;transform:rotate(-12deg)}.attached[data-gear=grabber]{left:calc(50% + 45px);top:23%;width:70px;height:105px;transform:rotate(10deg)}.attached[data-gear=bottle]{left:calc(50% - 65px);top:55%;width:42px;height:55px;transform:rotate(-8deg)}.gear-actions{display:flex;align-items:center;gap:18px;margin-top:8px}.flying{transform-origin:top left;position:fixed;z-index:20;background:url(gear.webp) no-repeat;background-size:300% 100%;pointer-events:none}.gear-status{min-height:24px;font-size:17px;font-weight:bold;margin:5px 0;color:#087c79}.room.equipping{background-image:url(cottage-table.webp)}.room.equipping .panel{inset:8% 12% 8%}.room.equipping .final{position:relative;flex:1;min-height:0;width:100%}.room.equipping .actor{animation:none;transform-origin:center bottom;position:absolute;left:0;right:0;top:8%;height:45%;margin:0;flex:none}.room.equipping .actor .sprite{height:100%;max-height:240px;width:100%;max-width:300px;flex:none}.room.equipping .gear-row{position:absolute;left:0;right:0;top:68%;margin:0;gap:10px}.room.equipping .gear-button{background:#fff7d9b8;box-shadow:0 4px 0 #956022}.room.equipping .gear-status{position:absolute;top:56%;left:0;right:0;margin:0}.room.equipping .gear-actions{position:absolute;left:0;right:0;bottom:0;justify-content:center;margin:0}.room.equipping .gear-art{max-height:90px}.room.equipping .gear-pointer{bottom:-14px}.room.equipping h1{flex:none}.room.equipping .hello{flex:none}
@keyframes enterCottage{0%{opacity:0;transform:translateY(-95px) scale(.48)}20%{opacity:1;transform:translateY(-65px) scale(.62) rotate(-3deg)}40%{transform:translateY(-40px) scale(.76) rotate(3deg)}60%{transform:translateY(-22px) scale(.88) rotate(-2deg)}80%{transform:translateY(-8px) scale(.96) rotate(2deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.attached{background-image:url(held-gear.webp);background-size:400% 100%;z-index:4;filter:drop-shadow(0 2px 1px #53472b33)}.gear-button:disabled{opacity:.65;cursor:default}.attached.hand-glove{z-index:6}.room.equipping .actor:after{content:"";position:absolute;bottom:-3px;left:calc(50% - 34px);width:68px;height:8px;background:#81531d35;border-radius:50%;z-index:-1;animation:floorShadow 1.7s ease-out both}@keyframes floorShadow{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}.room.equipping .actor.pose-motion{animation:none}.pose-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pose-active>img{visibility:hidden}.room.equipping .actor:has(.pose-active):after{animation:none}
.room.equipping .actor:after{display:none}.floor-shadow{display:none}.room.equipping .floor-shadow{display:block;position:absolute;top:53%;left:50%;width:75px;height:9px;transform:translate(-50%,-50%);background:#81531d35;border-radius:50%;pointer-events:none}.room.equipping .actor{z-index:1}
.bag-art{background:url(recycle-bag.png) center/contain no-repeat}.attached[data-gear=bag]{background:url(recycle-bag.png) center/contain no-repeat;z-index:3}.room.equipping .gear-row{z-index:3}.room.equipping .gear-actions{z-index:3}
.table-front{position:absolute;z-index:2;pointer-events:none;background:url(cottage-table.webp) center/100% 100% no-repeat;clip-path:inset(67.6% 0 0)}.room.equipping .gear-status{z-index:4}.attached[data-portal=true]{z-index:5}.final:has(.actor.at-table) .floor-shadow{visibility:hidden}
.final:has(.actor.at-table) .gear-status{top:5%}

/* Floor equipment scene: keep the existing four tap controls. */
.room.equipping{background-image:url(room.webp)}
.table-front{display:none}
.room.equipping .actor{top:46%;height:46%;z-index:2}
.room.equipping .actor .sprite{max-height:none;max-width:300px}
.room.equipping .gear-row{top:26%}

.room.equipping .panel{inset:20% 12% 5%}

.pose-canvas{z-index:1}

</style></head><body>
<main class="room">
<div class="toolbar"><button class="round" id="reset" aria-label="Start again">↺</button><button class="round" id="sound" aria-label="Mute sound" aria-pressed="false">🔊</button></div>
<section class="panel"><p class="mission"><strong>Imagine…</strong>If every person left every place<br>better than they found it.</p><h1>Street<br>Challenge</h1>
<div class="carousel" id="carousel" aria-label="Choose your avatar">
<button class="avatar" aria-label="Choose the purple-jacket avatar" aria-pressed="false" data-index="0"><span class="sprite"><img src="purple-player-v2.webp" alt="" style="height:102.040816%;top:-0.255102%;left:50%;transform:translateX(-51.666667%)"></span></button>

<button class="avatar" aria-label="Choose the blonde avatar" aria-pressed="false" data-index="2"><span class="sprite"><img src="blonde-player-v2.webp" alt="" style="height:102.960103%;top:-1.158301%;left:50%;transform:translateX(-52.416667%)"></span></button>

<button class="avatar" aria-label="Choose the orange-jacket avatar" aria-pressed="false" data-index="5"><span class="sprite"><img src="orange-avatar.webp" alt="" style="height:103.092784%;top:-2.061856%;left:50%;transform:translateX(-54.916667%)"></span></button>
<button class="avatar" aria-label="Choose the teal-jacket avatar" aria-pressed="false" data-index="6"><span class="sprite"><img src="teal-glasses-avatar.webp" alt="" style="height:103.492885%;top:-1.811125%;left:50%;transform:translateX(-48.916667%)"></span></button>
<button class="avatar" aria-label="Choose the yellow-jacket avatar" aria-pressed="false" data-index="7"><span class="sprite"><img src="yellow-avatar.webp" alt="" style="height:102.301790%;top:-1.150895%;left:50%;transform:translateX(-53.833333%)"></span></button>

</div><div class="hand" id="hand" aria-hidden="true">👆</div>

</section><div class="preview">Avatar & equipment preview · No account created</div></main>
<script type="module">
import {createGameAudio} from './audio.mjs';
import {createPosePlayer} from './pose-player.mjs';
const audio=createGameAudio(), $=id=>document.getElementById(id), avatars=[...document.querySelectorAll('.avatar')];
let posePlayer=null, busy=false;
let selected=null, muted=false, browsing=0;const equipped=new Set();let scene=0;const gearButtons=[...document.querySelectorAll(".gear-button")];const room=document.querySelector(".room"),title=document.querySelector("h1");
function speakReady(){if(muted||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance('Are you ready?');voice.lang='en-US';voice.rate=.95;voice.pitch=1.15;try{window.speechSynthesis.speak(voice)}catch{}}
const motionAssets=['purple-motion-v1.png','blue-cap-motion-v1.png','blonde-motion-v1.png','blue-hoodie-motion-v1.png','coral-motion-v1.png','orange-motion-v1.png','teal-glasses-motion-v1.png','yellow-motion-v1.png','mia-motion-v1.png'];
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function browse(index){browsing=Math.max(0,Math.min(avatars.length-1,index));const card=avatars[browsing],rail=$('carousel');rail.scrollTo({left:card.offsetLeft-rail.offsetLeft-(rail.clientWidth-card.clientWidth)/2,behavior:reduce?'instant':'smooth'});$('hand').style.visibility='hidden'}
function select(index){selected=index;browsing=index;avatars.forEach((a,i)=>{a.setAttribute('aria-pressed',String(i===index));a.classList.remove('chosen')});void avatars[index].offsetWidth;avatars[index].classList.add('chosen');$('choose').disabled=false;audio.play('select');browse(index)}
avatars.forEach((a,i)=>a.addEventListener('click',()=>select(i)));
$('carousel').addEventListener('pointerdown',()=>{$('hand').style.visibility='hidden'});
$('previous').onclick=()=>browse(browsing-1);$('next').onclick=()=>browse(browsing+1);
$('sound').onclick=()=>{muted=!muted;if(muted&&'speechSynthesis' in window)window.speechSynthesis.cancel();audio.setMuted(muted);$('sound').textContent=muted?'🔇':'🔊';$('sound').setAttribute('aria-pressed',String(muted));$('sound').setAttribute('aria-label',muted?'Turn sound on':'Mute sound');if(!muted)audio.play('select')};
$('choose').onclick=()=>{if(selected===null)return;audio.play('equip');$('carousel').style.display='none';$('controls').style.display='none';$('hand').style.display='none';$('nameForm').style.display='flex';$('firstName').focus()};
$('back').onclick=()=>{$('nameForm').style.display='none';$('carousel').style.display='flex';$('controls').style.display='flex'};
$('nameForm').onsubmit=async e=>{e.preventDefault();const name=$('firstName').value.trim();if(!name){$('firstName').value='';$('firstName').reportValidity();return}audio.play('celebrate');$('hello').textContent='Hi, '+name+'!';$('hero').replaceChildren(avatars[selected].querySelector('.sprite img').cloneNode(true));$('nameForm').style.display='none';$('final').style.display='flex';$('hero').style.animation='none';room.classList.add('equipping','entering');title.textContent='Are you ready?';title.style.animation=reduce?'none':'happy .5s ease';speakReady();scene++;positionTable();const current=scene;$('actor').style.visibility='hidden';busy=true;refreshGear();{posePlayer=createPosePlayer($('hero'),reduce,motionAssets[selected]);if(!await posePlayer.ready){posePlayer.dispose();posePlayer=null;}if(scene!==current)return;$('actor').style.visibility='visible';if(posePlayer)await posePlayer.jump();else if(!reduce){const a=$('actor').animate([{transform:'translateY(-180px) scale(.73)'},{transform:'translateY(-220px) scale(.85)',offset:.4},{transform:'translateY(0) scale(1)'}],{duration:1500,easing:'ease-in-out'});try{await a.finished}catch{}}}if(scene!==current)return;room.classList.remove('entering');positionTable();busy=false;refreshGear()};
function reset(){$('actor').style.visibility='visible';posePlayer?.dispose();posePlayer=null;busy=false;if('speechSynthesis' in window)window.speechSynthesis.cancel();title.style.animation='none';scene++;equipped.clear();room.classList.remove('equipping','entering');title.innerHTML='Street<br>Challenge';document.querySelectorAll('.attached').forEach(a=>a.remove());document.querySelectorAll('.flying,.floor-item,.gear-pointer').forEach(a=>a.remove());gearButtons.forEach(b=>{b.disabled=false;b.setAttribute('aria-pressed','false');b.querySelector('.gear-check').textContent=''});$('gearDone').disabled=true;$('gearDone').hidden=false;$('gearRow').hidden=false;$('gearStatus').textContent='';$('nameForm').style.display='none';$('final').style.display='none';$('carousel').style.display='flex';$('controls').style.display='flex';$('hand').style.display='block';$('hand').style.visibility='visible';$('firstName').value='';selected=null;avatars.forEach(a=>{a.setAttribute('aria-pressed','false');a.classList.remove('chosen')});$('choose').disabled=true;browsing=0;$('carousel').scrollLeft=0}

function refreshGear(){document.querySelectorAll('.gear-pointer').forEach(p=>p.remove());gearButtons.forEach(b=>b.disabled=busy||(b.dataset.gear!=='gloves'&&!equipped.has('gloves')));const next=gearButtons.find(b=>!equipped.has(b.dataset.gear));if(next){const p=document.createElement('span');p.className='gear-pointer';p.textContent='👆';p.setAttribute('aria-hidden','true');next.append(p)}$('gearDone').disabled=busy||equipped.size!==4;$('gearStatus').textContent=equipped.size===4?'All set!':equipped.size?equipped.size+' / 4':''}
const hands=[[[.22,.26],[.57,.54]],[[.30,.64],[.75,.36]],[[.24,.22],[.72,.62]],[[.26,.30],[.73,.64]],[[.22,.26],[.76,.62]],[[.27,.35],[.66,.60]],[[.22,.29],[.70,.64]],[[.22,.29],[.72,.66]],[[.22,.66],[.77,.24]]];
function attachGear(key){const image=$('hero').querySelector('img'),scale=parseFloat(image.style.height)/100,top=parseFloat(image.style.top)/100,center=parseFloat(image.style.transform.match(/-([\d.]+)%/)[1])/100,ratio=image.naturalWidth/image.naturalHeight||.75;const make=(side,cell,w,h,grip)=>{const [x,y]=hands[selected][side],node=document.createElement('span');node.className='attached'+(key==='gloves'?' hand-glove':'');node.dataset.gear=key;node.dataset.side=side;node.dataset.x=(x-center)*ratio*scale;node.style.cssText='background-position:'+(cell*100/3)+'% 0;top:'+((top+y*scale)*100)+'%;height:'+(h*100)+'%;transform:translate(-50%,-'+grip+'%)';if(posePlayer){node.dataset.x=side===0?-.10:(key==='grabber'?.10:.11);node.style.top=key==='grabber'?'49%':'53%';if(key==='grabber')node.style.transform='translate(-50%,0)';}node.dataset.w=w;node.dataset.h=h;if(posePlayer&&$('actor').classList.contains('at-table'))node.dataset.portal='true';node.setAttribute('aria-hidden','true');(node.dataset.portal?$('final'):$('hero')).append(node);return node};const nodes=key==='gloves'?[make(0,0,.13,.13,50),make(1,1,.13,.13,50)]:key==='bottle'?[make(0,2,.19,.25,20)]:key==='bag'?[make(0,0,.38,.44,6)]:[make(1,3,.23,.65,10)];positionHeld();return nodes}
function positionHeld(){const h=$('hero').clientHeight,rect=$('hero').getBoundingClientRect(),parent=$('final').getBoundingClientRect();document.querySelectorAll('.attached').forEach(n=>{
 if(n.dataset.portal){n.style.left=(rect.left-parent.left+rect.width/2+Number(n.dataset.x)*rect.height)+'px';n.style.top=(rect.top-parent.top+rect.height*.53)+'px';n.style.width=(Number(n.dataset.w)*rect.height)+'px';n.style.height=(Number(n.dataset.h)*rect.height)+'px';}
 else{n.style.left='calc(50% + '+(Number(n.dataset.x)*h)+'px)';n.style.width=(Number(n.dataset.w)*h)+'px'}
})}
function positionTable(){const r=room.getBoundingClientRect(),f=$('final').getBoundingClientRect(),table=document.querySelector('.table-front');document.querySelector('.floor-shadow').style.top=($('hero').getBoundingClientRect().bottom-f.top)+'px';table.style.cssText='left:'+(r.left-f.left)+'px;top:'+(r.top-f.top)+'px;width:'+r.width+'px;height:'+r.height+'px';positionHeld()}
new ResizeObserver(positionTable).observe(room);
new ResizeObserver(positionHeld).observe($('hero'));
gearButtons.forEach((button,index)=>button.onclick=async()=>{
 const key=button.dataset.gear;if(equipped.has(key)||button.disabled||busy)return;
 const current=scene;busy=true;refreshGear();audio.play('equip');
 if(posePlayer&&key==='gloves'){
   await posePlayer.gloves();if(scene!==current)return;
 }else{
   const nodes=attachGear(key);
   nodes.forEach(n=>n.style.visibility='hidden');
   if(posePlayer){
     const prop=document.createElement('span');prop.className='floor-item';prop.dataset.gear=key;
     const h=$('hero').clientHeight;
     prop.style.width=(Number(nodes[0].dataset.w)*h)+'px';
     prop.style.height=(Number(nodes[0].dataset.h)*h)+'px';
     prop.style.backgroundPosition=(key==='bottle'?200/3: key==='grabber'?100:0)+'% 0';
     document.body.append(prop);
     try{
       await posePlayer.pickup(key,prop,()=>{
         if(scene!==current)return;
         nodes.forEach(n=>n.style.visibility='visible');
       });
     }finally{prop.remove()}
   }else{
     // Keep a usable equipment selector if pose art cannot load.
     nodes.forEach(n=>n.style.visibility='visible');
   }
   if(scene!==current)return;

 }
 if(scene!==current)return;equipped.add(key);button.setAttribute('aria-pressed','true');button.querySelector('.gear-check').textContent='✓';busy=false;refreshGear();
});
$('gearDone').onclick=()=>{if(equipped.size!==4)return;document.querySelectorAll('.gear-pointer').forEach(p=>p.remove());$('gearStatus').textContent='Ready for the street!';$('gearDone').hidden=true;audio.play('celebrate');$('hero').style.animation='none';void $('hero').offsetWidth;$('hero').style.animation=reduce?'none':'happy .7s ease'};
$('reset').onclick=reset;$('again').onclick=reset;window.addEventListener('pagehide',()=>{posePlayer?.dispose();audio.dispose();if('speechSynthesis' in window)window.speechSynthesis.cancel()});
</script></body></html>

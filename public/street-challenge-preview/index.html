lumns:1.4fr repeat(6,minmax(0,1fr));gap:4px}.toolbar .round{width:100%;height:46px}.toolbar .signout{padding:0 2px;font-size:11px}.toolbar:has(#deadlineToggle[hidden]){display:flex}.hourglass-button svg{width:27px;height:34px;vertical-align:middle}.sand-stream{animation:sand-flow .7s linear infinite}@keyframes sand-flow{to{stroke-dashoffset:-4}}.hourglass-button[aria-expanded=true]{background:#ffda71;border-color:#07858b}

<script type="module">

let selected=null, muted=false, browsing=0;const equipped=new Set();let scene=0;const gearButtons=[...document.querySelectorAll(".gear-button")];const room=document.querySelector(".room"),title=document.querySelector("h1");
function openVoicePreview(){
 let dialog=$('voicePreviewDialog');
 if(!dialog){
  dialog=document.createElement('dialog');dialog.id='voicePreviewDialog';
  dialog.style.cssText='max-width:min(92vw,440px);border:3px solid #17a5a8;border-radius:20px;background:#fff8e5;color:#087c83;padding:20px;font:17px system-ui';
  const heading=document.createElement('h2');heading.textContent='Hear a storyteller voice';heading.style.margin='0 0 10px';
  const note=document.createElement('p');note.textContent='These samples use voices installed in your browser or computer. We will not change the game voice until you approve one.';
  const choose=document.createElement('select');choose.id='voicePreviewChoice';choose.setAttribute('aria-label','Choose sample voice');choose.style.cssText='width:100%;padding:10px;margin:10px 0;background:#fff;border-radius:10px;color:#087c83';
  const play=document.createElement('button');play.textContent='▶ Hear sample';play.className='game-button';play.type='button';
  const close=document.createElement('button');close.textContent='Close';close.className='text-button';close.type='button';close.style.marginLeft='12px';
  const msg=document.createElement('p');msg.id='voicePreviewMessage';msg.style.fontSize='13px';msg.textContent='';
  play.onclick=()=>{if(!('speechSynthesis' in window)){msg.textContent='Voice preview is unavailable in this browser.';return}
    const available=window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));
    const choice=available[Number(choose.value)];if(!choice){msg.textContent='No English voices are available yet.';return}
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance('Are you ready? Your Street Challenge adventure begins now! Let’s make our neighborhood shine!');
    utterance.voice=choice;utterance.lang=choice.lang;utterance.rate=1.04;utterance.pitch=1.12;
    window.speechSynthesis.speak(utterance);
    msg.textContent='Preview only — game voice unchanged.';
  };
  close.onclick=()=>{window.speechSynthesis?.cancel();dialog.close()};
  dialog.addEventListener('close',()=>window.speechSynthesis?.cancel());
  dialog.append(heading,note,choose,play,close,msg);document.body.append(dialog);
 }
 const choose=$('voicePreviewChoice');const populate=()=>{
  const voices=('speechSynthesis' in window?window.speechSynthesis.getVoices():[]).filter(v=>v.lang.toLowerCase().startsWith('en'));
  choose.replaceChildren();voices.forEach((v,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=v.name+' ('+v.lang+')';choose.append(option)});
  if(!voices.length){const option=document.createElement('option');option.textContent='No voices available';choose.append(option)}
  else{const preferred=voices.findIndex(v=>/zira|aria|jenny|samantha|ava|allison|female|natural/i.test(v.name));choose.value=String(Math.max(preferred,0))}
 };
 populate();if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=populate;

}
function speakReady(){if(window.matchMedia('(min-width:600px)').matches||muted||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance('Are you ready?');voice.lang='en-US';voice.rate=1.08;voice.pitch=1.3;voice.volume=1;try{window.speechSynthesis.speak(voice)}catch{}}
const motionAssets=['purple-motion-v1.png','blue-cap-motion-v1.png','blonde-motion-v1.png','blue-hoodie-motion-v1.png','coral-motion-v1.png','orange-motion-v1.png','teal-glasses-motion-v1.png','yellow-motion-v1.png','mia-motion-v1.png'];
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function browse(index){browsing=Math.max(0,Math.min(avatars.length-1,index));const card=avatars[browsing],rail=$('carousel');rail.scrollTo({left:card.offsetLeft-rail.offsetLeft-(rail.clientWidth-card.clientWidth)/2,behavior:reduce?'instant':'smooth'});$('hand').style.visibility='hidden'}
function select(index){selected=index;browsing=index;avatars.forEach((a,i)=>{a.setAttribute('aria-pressed',String(i===index));a.classList.remove('chosen')});void avatars[index].offsetWidth;avatars[index].classList.add('chosen');$('choose').disabled=false;audio.play('select');browse(index)}
avatars.forEach((a,i)=>a.addEventListener('click',()=>select(i)));
$('carousel').addEventListener('pointerdown',()=>{$('hand').style.visibility='hidden'});
$('previous').onclick=()=>browse(browsing-1);$('next').onclick=()=>browse(browsing+1);
$('sound').onclick=()=>{muted=!muted;if(muted&&'speechSynthesis' in window)window.speechSynthesis.cancel();audio.setMuted(muted);$('sound').textContent=muted?'🔇':'🔊';$('sound').setAttribute('aria-pressed',String(muted));$('sound').setAttribute('aria-label',muted?'Turn sound on':'Mute sound');if(!muted)audio.play('select')};
$('choose').onclick=()=>{if(selected===null)return;audio.play('equip');$('carousel').style.display='none';$('controls').style.display='none';$('hand').style.display='none';$('nameForm').style.display='flex';$('firstName').focus()};
$('back').onclick=()=>{$('nameForm').style.display='none';$('carousel').style.display='flex';$('controls').style.display='flex'};
async function enterEquipment(restoring=false){const name=$('firstName').value.trim();if(!name){$('firstName').value='';$('firstName').reportValidity();return}if(!restoring)audio.play('celebrate');$('hello').textContent='Hi, '+name+'!';$('hero').replaceChildren(avatars[selected].querySelector('.sprite img').cloneNode(true));$('nameForm').style.display='none';$('final').style.display='flex';$('hero').style.animation='none';room.classList.add('equipping','entering');title.textContent='Are you ready?';title.style.animation=reduce?'none':'happy .5s ease';scene++;positionTable();const current=scene;$('actor').style.visibility='hidden';busy=true;refreshGear();{posePlayer=createPosePlayer($('hero'),reduce,motionAssets[selected]);if(!await posePlayer.ready){posePlayer.dispose();posePlayer=null;}if(scene!==current)return;$('actor').style.visibility='visible';if(posePlayer&&!restoring)await posePlayer.jump();else if(!posePlayer&&!reduce&&!restoring){const a=$('actor').animate([{transform:'translateY(-180px) scale(.73)'},{transform:'translateY(-220px) scale(.85)',offset:.4},{transform:'translateY(0) scale(1)'}],{duration:1500,easing:'ease-in-out'});try{await a.finished}catch{}}}if(scene!==current)return;room.classList.remove('entering');positionTable();busy=false;refreshGear();storeProgress()};
function reset(){storeProgress();hubRequest++;clearProgress();$('signinCard').style.display='none';room.classList.remove('signing');$('welcomeBack').hidden=false;$('actor').style.visibility='visible';posePlayer?.dispose();posePlayer=null;busy=false;if('speechSynthesis' in window)window.speechSynthesis.cancel();title.style.animation='none';scene++;equipped.clear();room.classList.remove('equipping','entering');title.innerHTML='Street<br>Challenge';document.querySelectorAll('.attached').forEach(a=>a.remove());document.querySelectorAll('.flying,.floor-item,.gear-pointer').forEach(a=>a.remove());gearButtons.forEach(b=>{b.disabled=false;b.setAttribute('aria-pressed','false');b.querySelector('.gear-check').textContent=''});$('gearDone').disabled=true;$('gearDone').hidden=false;$('gearRow').hidden=false;$('gearStatus').textContent='';$('nameForm').style.display='none';$('final').style.display='none';$('carousel').style.display='flex';$('controls').style.display='flex';$('hand').style.display='block';$('hand').style.visibility='visible';$('firstName').value='';selected=null;avatars.forEach(a=>{a.setAttribute('aria-pressed','false');a.classList.remove('chosen')});$('choose').disabled=true;browsing=0;$('carousel').scrollLeft=0}

function refreshGear(){document.querySelectorAll('.gear-pointer').forEach(p=>p.remove());gearButtons.forEach(b=>b.disabled=busy||(b.dataset.gear!=='gloves'&&!equipped.has('gloves')));const next=gearButtons.find(b=>!equipped.has(b.dataset.gear));if(next){const p=document.createElement('span');p.className='gear-pointer';p.textContent='👆';p.setAttribute('aria-hidden','true');next.append(p)}$('gearDone').disabled=busy||equipped.size!==4;$('gearStatus').textContent=equipped.size===4?'All set!':equipped.size?equipped.size+' / 4':''}
const hands=[[[.22,.26],[.57,.54]],[[.30,.64],[.75,.36]],[[.24,.22],[.72,.62]],[[.26,.30],[.73,.64]],[[.22,.26],[.76,.62]],[[.27,.35],[.66,.60]],[[.22,.29],[.70,.64]],[[.22,.29],[.72,.66]],[[.22,.66],[.77,.24]]];
function attachGear(key){const image=$('hero').querySelector('img'),scale=parseFloat(image.style.height)/100,top=parseFloat(image.style.top)/100,center=parseFloat(image.style.transform.match(/-([\d.]+)%/)[1])/100,ratio=image.naturalWidth/image.naturalHeight||.75;const make=(side,cell,w,h,grip)=>{const [x,y]=hands[selected][side],node=document.createElement('span');node.className='attached'+(key==='gloves'?' hand-glove':'');node.dataset.gear=key;node.dataset.side=side;node.dataset.x=(x-center)*ratio*scale;node.style.cssText='background-position:'+(cell*100/3)+'% 0;top:'+((top+y*scale)*100)+'%;height:'+(h*100)+'%;transform:translate(-50%,-'+grip+'%)';if(posePlayer){node.dataset.x=side===0?-.10:(key==='grabber'?.10:.11);node.style.top=key==='grabber'?'49%':'53%';if(key==='grabber')node.style.transform='translate(-50%,0)';}node.dataset.w=w;node.dataset.h=h;if(posePlayer&&$('actor').classList.contains('at-table'))node.dataset.portal='true';node.setAttribute('aria-hidden','true');(node.dataset.portal?$('final'):$('hero')).append(node);return node};const nodes=key==='gloves'?[make(0,0,.13,.13,50),make(1,1,.13,.13,50)]:key==='bottle'?[make(0,2,.19,.25,20)]:key==='bag'?[make(0,0,.38,.44,6)]:[make(1,3,.23,.65,10)];if(key==='grabber'&&posePlayer){const shaft=nodes[0].cloneNode(true);shaft.classList.add('grabber-shaft');nodes[0].after(shaft);nodes.push(shaft)}positionHeld();return nodes}
function positionHeld(){const h=$('hero').clientHeight,rect=$('hero').getBoundingClientRect(),parent=$('final').getBoundingClientRect();document.querySelectorAll('.attached').forEach(n=>{
 if(n.dataset.portal){n.style.left=(rect.left-parent.left+rect.width/2+Number(n.dataset.x)*rect.height)+'px';n.style.top=(rect.top-parent.top+rect.height*.53)+'px';n.style.width=(Number(n.dataset.w)*rect.height)+'px';n.style.height=(Number(n.dataset.h)*rect.height)+'px';}
 else{n.style.left='calc(50% + '+(Number(n.dataset.x)*h)+'px)';n.style.width=(Number(n.dataset.w)*h)+'px'}
})}
function positionTable(){const r=room.getBoundingClientRect(),f=$('final').getBoundingClientRect(),table=document.querySelector('.table-front');document.querySelector('.floor-shadow').style.top=($('hero').getBoundingClientRect().bottom-f.top)+'px';table.style.cssText='left:'+(r.left-f.left)+'px;top:'+(r.top-f.top)+'px;width:'+r.width+'px;height:'+r.height+'px';positionHeld()}
new ResizeObserver(positionTable).observe(room);
new ResizeObserver(positionHeld).observe($('hero'));
gearButtons.forEach((button,index)=>button.onclick=async()=>{
 const key=button.dataset.gear;if(equipped.has(key)||button.disabled||busy)return;
 const current=scene;busy=true;refreshGear();audio.play('equip');
 if(posePlayer&&key==='gloves'){
   await posePlayer.gloves();if(scene!==current)return;
 }else{
   const nodes=attachGear(key);
   nodes.forEach(n=>n.style.visibility='hidden');
   if(posePlayer){
     const prop=document.createElement('span');prop.className='floor-item';prop.dataset.gear=key;
     const h=$('hero').clientHeight;
     prop.style.width=(Number(nodes[0].dataset.w)*h)+'px';
     prop.style.height=(Number(nodes[0].dataset.h)*h)+'px';
     prop.style.backgroundPosition=(key==='bottle'?200/3: key==='grabber'?100:0)+'% 0';
     document.body.append(prop);
     try{
       await posePlayer.pickup(key,prop,()=>{
         if(scene!==current)return;
         nodes.forEach(n=>n.style.visibility='visible');
       });
     }finally{prop.remove()}
   }else{
     // Keep a usable equipment selector if pose art cannot load.
     nodes.forEach(n=>n.style.visibility='visible');
   }
   if(scene!==current)return;

 }
 if(scene!==current)return;equipped.add(key);button.setAttribute('aria-pressed','true');button.querySelector('.gear-check').textContent='✓';busy=false;refreshGear();storeProgress();
});
function showReady(){document.querySelectorAll('.gear-pointer').forEach(p=>p.remove());$('gearRow').hidden=true;$('gearDone').hidden=true;title.innerHTML='Ready<span class="ready-line">For the Challenge!</span>';$('gearStatus').textContent='All set!'}
$('gearDone').onclick=()=>{if(equipped.size!==4)return;showReady();storeProgress();audio.play('celebrate');$('hero').style.animation='none';void $('hero').offsetWidth;$('hero').style.animation=reduce?'none':'happy .7s ease'};

let signedIn=false, savedHero=null, savedHeroes=[], activeHeroId=null;
const loginRecordedHeroes=new Set();
const switchUser=document.createElement('button');switchUser.id='switchUser';switchUser.className='text-button';switchUser.textContent='Switch user';switchUser.hidden=true;switchUser.onclick=showPlayers;$('signinCard').append(switchUser);
const picker=document.createElement('div');picker.className='hero-picker';picker.hidden=true;$('signinCard').prepend(picker);

const progressKey='street-challenge-progress-v1';
const selectedPlayerKey='street-challenge-selected-player-v1';
function rememberPlayer(id){try{localStorage.setItem(selectedPlayerKey,id)}catch{}}
function lastSelectedPlayer(){try{return localStorage.getItem(selectedPlayerKey)}catch{return null}}
function forgetPlayer(){try{localStorage.removeItem(selectedPlayerKey)}catch{}}
function clearProgress(){/* Keep saved progress during navigation. */}
let challengeState=null,restoringProgress=false,progressQueue=Promise.resolve(),hubRequest=0,clockAnchor=0,clockStarted=0;
async function challengeRequest(heroId,action,data={}){
 const response=await fetch('/api/street-challenge/challenge'+(action?'':'?heroId='+encodeURIComponent(heroId)),{method:action?'POST':'GET',credentials:'same-origin',cache:'no-store',keepalive:Boolean(action),headers:action?{'Content-Type':'application/json'}:undefined,body:action?JSON.stringify({heroId,action,...data}):undefined});
 const state=await response.json();if(!response.ok){const e=Error(state.error||'Please try again.');e.ended=state.ended;throw e}return state;
}
function setChallengeState(state){challengeState=state;clockAnchor=Date.parse(state.serverNow);clockStarted=performance.now();tickClock()}
let deadlineOpen=false,activeHubView='home';
function closeDeadline(){deadlineOpen=false;tickClock();layoutHeader()}
room.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(button&&button.id!=='deadlineToggle')closeDeadline();
},true);
$('deadlineToggle').onclick=async()=>{
 if(deadlineOpen){closeDeadline();return}
 if(activeHubView==='profile'||activeHubView==='rewards'){
 const h=savedHeroes.find(h=>h.id===activeHeroId)||savedHero;
 if(validHero(h))await showHub(h,'home');
 }
 deadlineOpen=true;tickClock();layoutHeader();
};
function tickClock(){
 const c=challengeState?.challenge,node=$('challengeClock'),toggle=$('deadlineToggle');const available=!!c&&signedIn;toggle.hidden=!available;node.hidden=!available||!deadlineOpen;toggle.setAttribute('aria-expanded',String(available&&deadlineOpen));toggle.setAttribute('aria-label',deadlineOpen?'Hide challenge deadline':'Show challenge deadline');
 if(!c)return;
 const seconds=Math.max(0,Math.ceil((Date.parse(c.ends_at)-(clockAnchor+performance.now()-clockStarted))/1000));
 const d=Math.floor(seconds/86400),h=Math.floor(seconds%86400/3600),m=Math.floor(seconds%3600/60);
 const deadline=new Intl.DateTimeFormat('en-US',{timeZone:c.timezone,month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(c.ends_at));
 node.textContent=seconds?'⏳ '+d+'d '+h+'h '+m+'m · Ends '+deadline:'Challenge ended! ⭐';
 if(!seconds&&room.classList.contains('equipping')){busy=true;refreshGear();$('gearStatus').textContent='Challenge ended! Return home for results.'}
}
setInterval(tickClock,1000);
function storeProgress(){
 if(restoringProgress||!signedIn||!activeHeroId||!room.classList.contains('equipping')||!challengeState?.entry)return;
 const heroId=activeHeroId,challengeId=challengeState.challenge?.id;if(!challengeId)return;
 const snapshot={heroId,challengeId,gear:[...equipped],done:$('gearDone').hidden,screen:$('gearDone').hidden?'ready':'equipment'};
 try{localStorage.setItem(progressKey,JSON.stringify(snapshot))}catch{}
 progressQueue=progressQueue.catch(()=>{}).then(async()=>{
 try{const state=await challengeRequest(heroId,'progress',snapshot);if(activeHeroId===heroId&&challengeState?.challenge?.id===challengeId)setChallengeState(state)}
 catch(e){if(activeHeroId===heroId){$('gearStatus').textContent=e.message;if(e.ended){busy=true;refreshGear();$('gearStatus').textContent=e.message}}}
 });return progressQueue;
}
function loadProgress(){try{return JSON.parse(localStorage.getItem(progressKey))}catch{return null}}
async function resumeHero(h,p){
 restoringProgress=true;equipped.clear();document.querySelectorAll('.attached').forEach(n=>n.remove());
 gearButtons.forEach(b=>{b.disabled=false;b.setAttribute('aria-pressed','false');b.querySelector('.gear-check').textContent=''});
 $('gearDone').hidden=false;$('gearRow').hidden=false;posePlayer?.dispose();posePlayer=null;activeHeroId=h.id;rememberPlayer(h.id);select(h.avatar);$('firstName').value=h.name;
 $('carousel').style.display='none';$('controls').style.display='none';$('hand').style.display='none';$('welcomeBack').hidden=true;
 $('signinCard').style.display='none';room.classList.remove('signing');
 try{
 await enterEquipment(Boolean(p));
 if(p&&Array.isArray(p.gear)){
 // Restore the equipment directly, without replaying pickups or overwriting the save.
 for(const key of ['gloves','grabber','bottle','bag']){
 if(!p.gear.includes(key))continue;
 // Use the glove-wearing character pose; separate glove sprites float over equipment.
 if(key==='gloves'&&posePlayer)await posePlayer.restoreGloves();else attachGear(key);
 equipped.add(key);const btn=gearButtons.find(b=>b.dataset.gear===key);btn.setAttribute('aria-pressed','true');btn.querySelector('.gear-check').textContent='✓';
 }
 refreshGear();if(p.done&&equipped.size===4){
 // Reapply the completed standing pose after gear is attached, without replaying motion.
 await posePlayer?.restoreReadyPose();
 showReady();
 }
 }
 }finally{restoringProgress=false}tickClock();storeProgress();
}

function loadDraft(){try{return JSON.parse(localStorage.getItem(draftKey))}catch{return null}}
function validHero(h){return h&&typeof h.name==='string'&&h.name.trim()&&h.name.length<=30&&Number.isInteger(h.avatar)&&h.avatar>=0&&h.avatar<avatars.length}
function message(text){$('signinMessage').textContent=text;$('signinMessage').hidden=!text}

async function showSessionCheck(){
 closeDeadline();
 let dialog=document.getElementById('sessionCheckDialog');
 if(!dialog){
 dialog=document.createElement('dialog');dialog.id='sessionCheckDialog';
 dialog.style.cssText='max-width:90vw;width:420px;border:3px solid #17a5a8;border-radius:22px;background:#fff6dc;color:#087c83;padding:22px;font:18px system-ui';
 const heading=document.createElement('h2');heading.textContent='Saved sign-in check';
 const result=document.createElement('p');result.id='sessionCheckResult';result.style.whiteSpace='pre-line';
 const newTab=document.createElement('button');newTab.className='game-button';newTab.textContent='Open this game in a new tab';
 newTab.onclick=()=>{const url=new URL(location.pathname,location.origin);url.searchParams.set('session_check','1');window.open(url.href,'_blank')};
 const close=document.createElement('button');close.className='text-button';close.textContent='Close';close.onclick=()=>dialog.close();
 dialog.append(heading,result,newTab,close);document.body.append(dialog);
 }
 if(!dialog.open)dialog.showModal();
 const result=document.getElementById('sessionCheckResult');result.textContent='Checking this game tab…';
 try{
 const response=await fetch('/api/street-challenge/account?diagnostics=1',{credentials:'same-origin',cache:'no-store'});
 const data=await response.json();
 if(!response.ok||data.unavailable)throw Error('The check is unavailable. Please try again.');
 result.textContent='This game tab: '+(data.signedIn?'SIGNED IN':'NOT SIGNED IN')+'\nSaved sign-in cookie: '+(data.sessionCookiePresent?'PRESENT':'MISSING')+'\nStatus: '+data.reason+'\nGame address: '+location.hostname;
 }catch(e){result.textContent=e.message}
}

function showAccountRetry(text){
 showSignin();
 title.textContent='Let’s try again!';
 $('emailForm').hidden=true;
 $('emailSent').hidden=true;
 $('continueHero').hidden=true;
 picker.hidden=false;
 picker.replaceChildren();
 const retry=document.createElement('button');
 retry.className='game-button';
 retry.textContent='Try again ✨';
 retry.onclick=async()=>{
   retry.disabled=true;
   try{
     const state=await account();
     signedIn=state.signedIn;
     savedHeroes=state.heroes||[];
     savedHero=state.hero;
     $('signout').hidden=!signedIn;
     if(signedIn){
       if(savedHeroes.length===1)showHub(savedHeroes[0],'home',true);
       else showPlayers();
     }else{
       showSignin();
       title.textContent='Welcome back!';
       $('email').focus();
     }
   }catch(e){showAccountRetry(e.message)}
 };
 picker.append(retry);
 message(text||'Your saved game couldn’t be checked. Please try again.');
}

async function account(action,data={}){const response=await fetch('/api/street-challenge/account',{method:action?'POST':'GET',credentials:'same-origin',headers:action?{'Content-Type':'application/json'}:undefined,body:action?JSON.stringify({action,...data}):undefined,cache:'no-store'});const result=await response.json();if(!response.ok||result.unavailable)throw Error(result.error||'Your saved game couldn’t be loaded. Tap I’m back to try again.');return result}
async function recordPlayerLogin(h){
 if(!validHero(h)||loginRecordedHeroes.has(h.id))return null;
 const result=await account('resume',{heroId:h.id});
 loginRecordedHeroes.add(h.id);
 if(result.hero){savedHeroes=savedHeroes.map(player=>player.id===h.id?{...player,...result.hero}:player);if(savedHero?.id===h.id)savedHero={...savedHero,...result.hero}}
 return result.latestHistory||null;
}
function showSignin(){room.classList.remove('hub');$('switchUser').hidden=true;picker.hidden=true;room.classList.remove('equipping');room.classList.add('signing');$('welcomeBack').hidden=true;$('carousel').style.display='none';$('controls').style.display='none';$('hand').style.display='none';$('nameForm').style.display='none';$('final').style.display='none';$('signinCard').style.display='flex';$('signinBack').hidden=false;title.textContent=signedIn?'Your hero is saved!':'Save your hero!';$('signinHero').replaceChildren();if(selected!==null)$('signinHero').append(avatars[selected].querySelector('img').cloneNode(true));$('signinGreeting').textContent=$('firstName').value.trim()?'Hi, '+$('firstName').value.trim()+'!':'';$('emailForm').hidden=signedIn;$('emailSent').hidden=true;$('continueHero').hidden=!signedIn;message('')}
let savingHero=false;
async function saveAndContinue(){if(selected===null||savingHero)return;savingHero=true;try{const result=await account('save',{name:$('firstName').value.trim(),avatar:selected,heroId:activeHeroId});savedHero=result.hero;savedHeroes=result.heroes;activeHeroId=savedHero.id;try{localStorage.removeItem(draftKey)}catch{}$('signinCard').style.display='none';room.classList.remove('signing');showHub(savedHero)}catch(e){showSignin();message(e.message)}finally{savingHero=false}}
$('nameForm').onsubmit=async e=>{e.preventDefault();activeHeroId=null;if(!$('firstName').value.trim())return;storeDraft();showSignin();if(signedIn)await saveAndContinue()};
$('emailForm').onsubmit=async e=>{e.preventDefault();$('sendLink').disabled=true;message('');storeDraft();try{await account('send',{email:$('email').value.trim(),hero:{name:$('firstName').value.trim(),avatar:selected}});$('emailForm').hidden=true;$('emailSent').hidden=false;audio.play('select')}catch(e){message(e.message)}finally{$('sendLink').disabled=false}};
$('codeForm').onsubmit=async e=>{e.preventDefault();const button=$('verifyCode');button.disabled=true;message('Verifying your code…');try{await account('verify',{email:$('email').value.trim(),code:$('signinCode').value.trim()});const state=await account();if(!state.signedIn)throw Error('Verification succeeded, but the session was not retained. Please retry.');signedIn=true;savedHeroes=state.heroes||[];savedHero=state.hero;$('signout').hidden=false;if(savedHeroes.length===1){await showHub(savedHeroes[0],'home',true)}else if(savedHeroes.length>1){showPlayers()}else{const h=loadDraft();if(validHero(h)){select(h.avatar);$('firstName').value=h.name;await saveAndContinue()}else{showSignin();message('Your email is verified. Choose your hero to continue.')}}}catch(error){message(error.message)}finally{button.disabled=false}};
$('changeEmail').onclick=()=>{$('emailSent').hidden=true;$('emailForm').hidden=false;message('');$('email').focus()};
$('signinBack').onclick=()=>{reset()};

$('continueHero').onclick=saveAndContinue;
$('checkSignin').onclick=async()=>{try{const state=await account();signedIn=state.signedIn;$('signout').hidden=!signedIn;savedHeroes=state.heroes||[];if(signedIn&&savedHeroes.length){const p=loadProgress();const h=savedHeroes.find(h=>h.id===p?.heroId)||savedHeroes.find(h=>h.id===activeHeroId);if(h||savedHeroes.length===1)showHub(h||savedHeroes[0],'home',true);else showPlayers();return}if(!signedIn){message('Enter the code sent to your email above.');return}const h=loadDraft()||state.hero;if(validHero(h)){select(h.avatar);$('firstName').value=h.name;await saveAndContinue()}else reset()}catch(e){message(e.message)}};
async function showHub(h,view='home',autoResume=false){
 activeHubView=view;closeDeadline();
 const requestId=++hubRequest;
 await storeProgress();await progressQueue;
 if(requestId!==hubRequest)return;
 activeHeroId=h.id;rememberPlayer(h.id);select(h.avatar);$('firstName').value=h.name;
 try{await recordPlayerLogin(h)}catch(e){message(e.message)}
 showSignin();room.classList.add('hub');$('switchUser').hidden=false;
 for(const id of ['homeNav','profileNav','rewardsNav'])$(id).hidden=false;
 title.textContent=view==='profile'?'Your profile':view==='rewards'?'Your rewards':'Welcome back!';
 $('continueHero').hidden=true;$('signinBack').hidden=true;picker.hidden=false;picker.replaceChildren();
 if(view==='home'){
 const loading=document.createElement('p');loading.textContent='Finding your challenge…';picker.append(loading);
 try{
 const state=await challengeRequest(h.id);if(requestId!==hubRequest)return;setChallengeState(state);picker.replaceChildren();
 const c=state.challenge;
 if(autoResume&&state.entry){await resumeHero(h,state.entry);return}
 if(state.previous){const results=document.createElement('p');results.textContent='Your previous challenge ended! '+(state.previous.challenge.results_status==='published'?'Results are ready.':'Winners will be announced after final checks.');picker.append(results)}
 if(c){const b=document.createElement('button');b.className='game-button';b.textContent=state.entry?'Return to Challenge ⭐':'Begin the Challenge 🌟';
 b.onclick=async()=>{
 speakReady();
 b.disabled=true;message('');
 try{const latest=await challengeRequest(h.id,'join',{challengeId:c.id});setChallengeState(latest);await resumeHero(h,state.entry?latest.entry:null)}
 catch(e){message(e.message);if(e.ended)showHub(h);else b.disabled=false}
 };picker.append(b);
 }else{const note=document.createElement('p');note.textContent='The next challenge is coming soon!';picker.append(note)}

 }catch(e){if(requestId!==hubRequest)return;picker.replaceChildren();message(e.message);const retry=document.createElement('button');retry.className='game-button';retry.textContent='Try again';retry.onclick=()=>showHub(h);picker.append(retry)}
 }else if(view==='profile'){
 const heading=document.createElement('p');heading.className='hello';heading.textContent='Family Players';picker.append(heading);
 const note=document.createElement('p');note.textContent='Each player has their own avatar and Challenge progress under this email.';picker.append(note);
 const cards=document.createElement('div');cards.className='hero-picker';cards.style.maxHeight='32svh';
 for(const player of savedHeroes){
  if(!validHero(player))continue;
  const card=document.createElement('button');card.type='button';card.className='hero-card';
  if(player.id===h.id)card.style.borderColor='#e85870';
  const img=avatars[player.avatar].querySelector('img').cloneNode(true);img.removeAttribute('style');
  const name=document.createElement('span');name.textContent=player.name+(player.id===h.id?' · Playing':'');
  card.append(img,name);card.onclick=()=>showHub(player,'home',true);cards.append(card);
 }
 picker.append(cards);
 const add=document.createElement('button');add.className='game-button';add.type='button';add.textContent='＋ Add Family Member';
 add.onclick=async()=>{
  add.disabled=true;
  try{
   await storeProgress();await progressQueue;
   activeHeroId=null;reset();
   $('welcomeBack').hidden=true;
   title.textContent='Choose a new hero!';
  }catch(e){add.disabled=false;message(e.message)}
 };picker.append(add);
 const back=document.createElement('button');back.className='text-button';back.type='button';back.textContent='Return to Challenge';
 back.onclick=()=>showHub(h,'home',true);picker.append(back);
 }else{
 const text=document.createElement('p');text.textContent='Your rewards will appear here as you earn them!';picker.append(text);
 }

}
for(const [id,view] of [['homeNav','home'],['profileNav','profile'],['rewardsNav','rewards']]){
 $(id).onclick=()=>{const h=savedHeroes.find(h=>h.id===activeHeroId)||savedHero;if(validHero(h))showHub(h,view);else showPlayers()};
}
function showPlayers(){hubRequest++;showSignin();title.textContent='Choose Your Player';$('signinHero').replaceChildren();$('signinGreeting').textContent='';$('emailForm').hidden=true;$('continueHero').hidden=true;picker.hidden=false;picker.replaceChildren();savedHeroes.forEach(h=>{if(!validHero(h))return;const b=document.createElement('button');b.className='hero-card';const img=avatars[h.avatar].querySelector('img').cloneNode(true);img.removeAttribute('style');const label=document.createElement('span');label.textContent=h.name;b.append(img,label);b.onclick=()=>showHub(h,'home',true);picker.append(b)});const add=document.createElement('button');add.className='game-button';add.textContent='＋ New hero';add.onclick=()=>{activeHeroId=null;reset()};picker.append(add)}
$('welcomeBack').onclick=async()=>{try{const state=await account();signedIn=state.signedIn;savedHeroes=state.heroes||[];}catch(e){showAccountRetry(e.message);return}if(signedIn){if(savedHeroes.length===1)showHub(savedHeroes[0],'home',true);else showPlayers();}else{showSignin();title.textContent='Welcome back!';$('email').focus()}};
$('signout').onclick=async()=>{try{await account('logout');signedIn=false;challengeState=null;deadlineOpen=false;$('deadlineToggle').hidden=true;$('challengeClock').hidden=true;for(const id of ['homeNav','profileNav','rewardsNav'])$(id).hidden=true;savedHero=null;forgetPlayer();$('signout').hidden=true;reset()}catch(e){showSignin();message(e.message)}};
async function restoreAccount(){try{const state=await account();signedIn=state.signedIn;$('signout').hidden=!signedIn;savedHero=state.hero;savedHeroes=state.heroes||[];const params=new URLSearchParams(location.search);let returnedHero=null;const returned=new URLSearchParams(location.hash.slice(1)).get('hero');if(signedIn&&params.get('signin')==='success'&&returned){try{const h=JSON.parse(returned);if(validHero(h)){returnedHero=h;try{localStorage.setItem(draftKey,JSON.stringify(h))}catch{}}}catch{}}if(params.has('signin'))history.replaceState(null,'',location.pathname);if(signedIn&&params.get('signin')==='success'){const draft=returnedHero||loadDraft();if(savedHeroes.length){if(savedHeroes.length===1)await showHub(savedHeroes[0],'home',true);else showPlayers();return}const h=draft||savedHero;if(validHero(h)){const existing=savedHeroes.find(player=>player.id===loadProgress()?.heroId&&player.name===h.name&&player.avatar===h.avatar)||savedHeroes.find(player=>player.name===h.name&&player.avatar===h.avatar);if(existing){await showHub(existing,'home',true);return}select(h.avatar);$('firstName').value=h.name;showSignin();await saveAndContinue()}else{reset();$('welcomeBack').hidden=true}}else if(signedIn){if(savedHeroes.length>1){showPlayers()}else if(savedHeroes.length===1&&validHero(savedHeroes[0])){await showHub(savedHeroes[0],'home',true)}else{showSignin();title.textContent='Welcome back!';message('Signed in, but no saved player was found for this email. Please do not create another avatar.')}}else if(params.get('signin')==='expired'){const h=loadDraft();if(validHero(h)){select(h.avatar);$('firstName').value=h.name}showSignin();message('That link expired. Send a fresh one.')}}catch(e){showAccountRetry(e.message)}finally{room.classList.remove('booting')}}
const toolbar=document.querySelector('.toolbar'),clock=$('challengeClock');
function layoutHeader(){room.style.setProperty('--clock-top',(toolbar.offsetTop+toolbar.offsetHeight+10)+'px');room.style.setProperty('--header-bottom',(clock.offsetTop+clock.offsetHeight+16)+'px')}
const headerObserver=new ResizeObserver(layoutHeader);headerObserver.observe(toolbar);headerObserver.observe(clock);layoutHeader();
restoreAccount();
window.addEventListener('pageshow',event=>{if(event.persisted&&!room.classList.contains('equipping'))restoreAccount()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('emailSent').hidden)restoreAccount()});
$('reset').onclick=reset;$('again').onclick=reset;window.addEventListener('pagehide',()=>{storeProgress();if('speechSynthesis' in window)window.speechSynthesis.cancel()});
</script></body></html>
